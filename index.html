<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>CI/CD Pipeline Demo</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
		        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			        min-height: 100vh;
				        display: flex;
					        align-items: center;
						        justify-content: center;
							        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6dd5ed 100%);
								        color: #fff;
									    }

	    .card {
		            background: rgba(255, 255, 255, 0.08);
			            backdrop-filter: blur(12px);
				            border: 1px solid rgba(255, 255, 255, 0.2);
					            border-radius: 16px;
						            padding: 48px 56px;
							            max-width: 520px;
								            text-align: center;
									            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
										        }

	        .badge {
			        display: inline-block;
				        background: #2ecc71;
					        color: #063d20;
						        font-size: 13px;
							        font-weight: 600;
								        padding: 6px 14px;
									        border-radius: 999px;
										        margin-bottom: 20px;
											        letter-spacing: 0.5px;
												    }

		    h1 {
			            font-size: 28px;
				            margin-bottom: 12px;
					            line-height: 1.3;
						        }

		        p {
				        font-size: 15px;
					        color: rgba(255, 255, 255, 0.85);
						        line-height: 1.6;
							        margin-bottom: 8px;
								    }

			    .footer {
				            margin-top: 28px;
					            font-size: 12px;
						            color: rgba(255, 255, 255, 0.5);
							        }

			        code {
					        background: rgba(0, 0, 0, 0.25);
						        padding: 2px 6px;
							        border-radius: 4px;
								        font-size: 13px;
									    }
</style>
	</head>
	<body>
		    <div class="card">
			            <span class="badge">● LIVE</span>
				            <h1>Hello from my own CI/CD pipeline!</h1>
					            <p>This page was deployed automatically by Jenkins.</p>
						            <p>Push → Checkout → Test → Deploy — no manual steps involved.</p>
							            <div class="footer">Served via <code>nginx</code> · Built with <code>Jenkins</code></div>
								        </div>
	</body>
</html>
